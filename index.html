<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vid's UX Job Prep Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #161617;
    --card: #1c1c1e;
    --border: #2a2a2d;
    --text: #f0ede8;
    --muted: #7a7a80;
    --accent: #e8c547;
    --portfolio: #a78bfa;
    --interview: #6ee7b7;
    --design: #f9a87c;
    --jobs: #60a5fa;
    --mock: #f472b6;
    --rest: #4b5563;
    --progress-bg: #2a2a2d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
  }

  .header-left h1 span {
    color: var(--accent);
  }

  .header-left p {
    margin-top: 0.5rem;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .header-right {
    text-align: right;
  }

  .big-number {
    font-family: 'DM Mono', monospace;
    font-size: 3.5rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
  }

  .big-number span {
    font-size: 1.2rem;
    color: var(--muted);
  }

  .days-left {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* PROGRESS */
  .progress-section {
    max-width: 1100px;
    margin: 2rem auto 0;
    padding: 0 2rem;
  }

  .progress-bar-outer {
    background: var(--progress-bg);
    border-radius: 100px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f4a261);
    border-radius: 100px;
    transition: width 0.4s ease;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* LEGEND */
  .legend {
    max-width: 1100px;
    margin: 1.5rem auto 0;
    padding: 0 2rem;
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .leg-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* MONTH FILTERS */
  .filters {
    max-width: 1100px;
    margin: 2rem auto 0;
    padding: 0 2rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* MAIN CONTENT */
  main {
    max-width: 1100px;
    margin: 2rem auto 4rem;
    padding: 0 2rem;
  }

  .month-block {
    margin-bottom: 3rem;
  }

  .month-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .month-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }

  .month-theme {
    font-size: 0.82rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .month-progress {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  /* DAY CARD */
  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
    user-select: none;
  }

  .day-card:hover {
    border-color: #3a3a40;
    transform: translateY(-1px);
  }

  .day-card.done {
    background: #141416;
    border-color: var(--border);
    opacity: 0.55;
  }

  .day-card.rest-day {
    border-style: dashed;
  }

  .checkbox {
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 12px;
    color: transparent;
  }

  .day-card.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e0f;
  }

  .day-content { flex: 1; min-width: 0; }

  .day-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
    letter-spacing: 0.05em;
  }

  .day-topic {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    line-height: 1.3;
  }

  .day-card.done .day-topic {
    text-decoration: line-through;
    color: var(--muted);
  }

  .day-sub {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 7px;
  }

  .day-tag {
    font-size: 10.5px;
    padding: 2px 9px;
    border-radius: 100px;
    display: inline-block;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  footer strong {
    color: var(--accent);
    font-weight: 500;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    header { padding: 2rem 1.25rem 1.5rem; }
    .progress-section, .legend, .filters, main { padding: 0 1.25rem; }
    .days-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Job Prep<br><span>Tracker.</span></h1>
    <p>UX / UI Designer — Target: September 2025</p>
  </div>
  <div class="header-right">
    <div class="big-number" id="pct-display">0<span>%</span></div>
    <div class="days-left" id="days-done-display">0 of 108 days done</div>
  </div>
</header>

<div class="progress-section">
  <div class="progress-bar-outer">
    <div class="progress-bar-inner" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-meta">
    <span id="streak-display">streak: 0 days</span>
    <span id="remaining-display">108 days remaining</span>
  </div>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#a78bfa"></div>Portfolio</div>
  <div class="leg"><div class="leg-dot" style="background:#6ee7b7"></div>Interview Q&A</div>
  <div class="leg"><div class="leg-dot" style="background:#f9a87c"></div>Design skills</div>
  <div class="leg"><div class="leg-dot" style="background:#60a5fa"></div>Job hunting</div>
  <div class="leg"><div class="leg-dot" style="background:#f472b6"></div>Mock practice</div>
  <div class="leg"><div class="leg-dot" style="background:#4b5563"></div>Rest</div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterMonth('all', this)">All months</button>
  <button class="filter-btn" onclick="filterMonth('May', this)">May</button>
  <button class="filter-btn" onclick="filterMonth('June', this)">June</button>
  <button class="filter-btn" onclick="filterMonth('July', this)">July</button>
  <button class="filter-btn" onclick="filterMonth('August', this)">August</button>
  <button class="filter-btn" onclick="filterMonth('undone', this)">Remaining only</button>
</div>

<main id="main-content"></main>

<footer>Built for <strong>Vid</strong> · From Systems to Stories · September 2025 🎯</footer>

<script>
const MONTHS = [
  { name: "May", theme: "Foundation", days: [
    ["Your origin story", "Draft 'Tell me about yourself'", "Interview Q&A"],
    ["The non-traditional angle", "Own your sysadmin → designer path", "Portfolio"],
    ["STAR format basics", "Situation-Task-Action-Result method", "Interview Q&A"],
    ["Zoom case study walkthrough", "Present it out loud — timed", "Mock practice"],
    ["Portfolio audit", "List what's strong, what needs work", "Portfolio"],
    ["UX vocabulary", "Discovery, synthesis, ideation, validation", "Design skills"],
    ["REST DAY", "Review week 1, note what felt hard", "Rest"],
    ["Behavioral Q: 'Tell me a challenge'", "Write + practice STAR answer", "Interview Q&A"],
    ["Behavioral Q: 'Why design?'", "Your transition story — make it compelling", "Interview Q&A"],
    ["Heuristic evaluation", "Nielsen's 10 heuristics — apply to any app", "Design skills"],
    ["Case study: problem statement", "Zoom — sharpen this section", "Portfolio"],
    ["Case study: research section", "Tighten the research story", "Portfolio"],
    ["UI critique practice", "Pick any popular app, critique it", "Design skills"],
    ["REST DAY", "Revisit your weakest answers", "Rest"],
    ["UX research basics", "Interviews, surveys, usability testing", "Design skills"],
    ["Behavioral Q: 'Your design process'", "Write full STAR answer", "Interview Q&A"],
    ["Vault 404 mini case study", "Document it for your portfolio", "Portfolio"],
    ["Persona building practice", "Create a persona for a product you use", "Design skills"],
    ["Behavioral Q: 'Handling feedback'", "STAR answer + practice out loud", "Interview Q&A"],
    ["Portfolio narrative polish", "Refine 'From Systems to Stories'", "Portfolio"],
    ["REST DAY", "Record a mock Q&A with yourself", "Rest"],
    ["Information architecture", "Card sorting, sitemaps, nav patterns", "Design skills"],
    ["Behavioral Q: 'Failed project'", "Honest, growth-focused STAR answer", "Interview Q&A"],
    ["Wireframing speed drill", "Low-fi wireframe an app in 30 mins", "Design skills"],
    ["LinkedIn audit", "Headline, about, featured projects", "Job hunting"],
    ["Resume polish", "UX-first reframe of your experience", "Job hunting"],
    ["May wrap-up", "Review all STAR answers, identify gaps", "Mock practice"],
  ]},
  { name: "June", theme: "Interview Mechanics", days: [
    ["Design challenge intro", "What to expect, how to structure answers", "Design skills"],
    ["Live design challenge", "Redesign a broken checkout flow — 30 mins", "Mock practice"],
    ["Challenge debrief", "What worked, what you'd do differently", "Mock practice"],
    ["Whiteboard challenge", "Design an onboarding flow from scratch", "Design skills"],
    ["Metrics in UX", "HEART framework — talk about success", "Interview Q&A"],
    ["Behavioral Q bank", "Write 5 new STAR answers", "Interview Q&A"],
    ["REST DAY", "Record yourself presenting Zoom case study", "Rest"],
    ["Anonymous Q&A deep dive", "Articulate your design decisions", "Portfolio"],
    ["Portfolio website review", "Mobile test, all links, transitions", "Portfolio"],
    ["Design systems vocabulary", "Tokens, components, variants — speak fluently", "Design skills"],
    ["Accessibility basics", "WCAG, contrast, keyboard nav", "Design skills"],
    ["Behavioral Q: 'How you prioritize'", "STAR using real NextLeap example", "Interview Q&A"],
    ["Live challenge: fintech", "Design a fintech app feature", "Mock practice"],
    ["REST DAY", "Full portfolio read — fresh eyes", "Rest"],
    ["Competitor analysis", "Compare 2 apps in the same space", "Design skills"],
    ["Behavioral Q: 'Cross-functional work'", "Show you can work with eng/PMs", "Interview Q&A"],
    ["Figma skills audit", "Auto-layout, components, variables — gaps?", "Design skills"],
    ["Figma gap filling", "Practice whichever skill felt weakest", "Design skills"],
    ["Questions to ask interviewers", "Build a list of 10 smart questions", "Interview Q&A"],
    ["Research synthesis", "Affinity mapping, insights extraction", "Design skills"],
    ["REST DAY", "Timed 10-min mock portfolio presentation", "Rest"],
    ["Job search strategy", "Startups vs product companies", "Job hunting"],
    ["Job boards setup", "LinkedIn, Wellfound, Cutshort, Naukri — set alerts", "Job hunting"],
    ["Cold outreach templates", "Write 2 personalised reach-out messages", "Job hunting"],
    ["Live challenge: e-commerce", "Design a search experience", "Mock practice"],
    ["Challenge debrief", "Structure, clarity, how you communicated", "Mock practice"],
    ["Network + community", "Comment on 3 posts, reach out to 1 designer", "Job hunting"],
    ["June wrap-up", "Record + review full mock Q&A", "Mock practice"],
  ]},
  { name: "July", theme: "Active Applying", days: [
    ["Application tracker setup", "Notion/sheet — company, role, status", "Job hunting"],
    ["First batch of applications", "Apply to 5 roles — tailored, not spray-and-pray", "Job hunting"],
    ["Cover letter template", "Write a flexible, non-generic base", "Job hunting"],
    ["Portfolio fix #1", "From your June weak-points list", "Portfolio"],
    ["Live challenge: notifications", "Design a notification system", "Mock practice"],
    ["Apply to 5 more roles", "Track everything", "Job hunting"],
    ["REST DAY", "Check tracker — any responses yet?", "Rest"],
    ["Portfolio fix #2", "From your June weak-points list", "Portfolio"],
    ["New mini case study", "Start documenting a new design brief", "Portfolio"],
    ["Behavioral Q mock", "Full 30-min mock interview — timed", "Mock practice"],
    ["Apply to 5 more roles", "Prioritise roles that excite you", "Job hunting"],
    ["System design for UX", "Scalable design systems thinking", "Design skills"],
    ["Challenge: edtech", "Design a dashboard for teachers", "Mock practice"],
    ["REST DAY", "Follow up on all open applications", "Rest"],
    ["Portfolio fix #3", "Final item from June weak-points list", "Portfolio"],
    ["Apply to 5 more roles", "Include stretch companies", "Job hunting"],
    ["Handling rejection", "What to say, how to follow up gracefully", "Interview Q&A"],
    ["Behavioral Q: 'Future goals'", "Ambitious but grounded STAR answer", "Interview Q&A"],
    ["Mini case study finish", "Wrap + publish the new piece", "Portfolio"],
    ["Portfolio walkthrough", "Timed 15-min presentation — record it", "Mock practice"],
    ["REST DAY", "Review recording — what to improve", "Rest"],
    ["Apply to 5 more roles", "Focus on good-fit startups", "Job hunting"],
    ["Networking follow-ups", "Check in with June contacts", "Job hunting"],
    ["Challenge: health app", "Design onboarding for a wellness app", "Mock practice"],
    ["Salary research", "Know your range for UX/UI in India", "Job hunting"],
    ["Negotiation basics", "Talk about compensation confidently", "Interview Q&A"],
    ["July wrap-up", "Count applications, responses, learnings", "Mock practice"],
    ["REST DAY", "You've been applying a whole month — reset da!", "Rest"],
  ]},
  { name: "August", theme: "Sharpening", days: [
    ["Full mock interview #1", "Behavioral + portfolio — record it", "Mock practice"],
    ["Mock debrief", "What landed, what didn't", "Mock practice"],
    ["Refine weakest answers", "Rewrite 3 shaky STAR answers", "Interview Q&A"],
    ["Apply to 5 more roles", "Keep pipeline full", "Job hunting"],
    ["Design challenge speed round", "20 mins — redesign any app feature", "Mock practice"],
    ["Design systems deep dive", "Study Material or Atlassian design system", "Design skills"],
    ["REST DAY", "Follow up on all open applications", "Rest"],
    ["Full mock interview #2", "Design challenge round — timed", "Mock practice"],
    ["Mock debrief", "Was your thinking clear? Good questions asked?", "Mock practice"],
    ["Apply to 5 more roles", "Include dream companies", "Job hunting"],
    ["UX writing basics", "Microcopy, error messages, empty states", "Design skills"],
    ["Portfolio final polish", "Last round of improvements", "Portfolio"],
    ["Behavioral Q final run", "Full bank — timed", "Mock practice"],
    ["REST DAY", "Almost there da!", "Rest"],
    ["Full mock interview #3", "Behavioral + portfolio + design challenge", "Mock practice"],
    ["Final debrief", "What are you most nervous about? Fix it.", "Mock practice"],
    ["Apply to 5 more roles", "Dream companies — go for it", "Job hunting"],
    ["Confidence prep", "Write everything you've learned since May", "Interview Q&A"],
    ["Final portfolio read", "Fresh eyes — does it tell your story?", "Portfolio"],
    ["Interview day ritual", "Night-before + morning-of prep plan", "Interview Q&A"],
    ["REST DAY", "Trust the work you've put in da", "Rest"],
    ["Apply + follow up", "Final push", "Job hunting"],
    ["Rapid-fire Q drill", "30 questions, 60 seconds each", "Mock practice"],
    ["Design challenge sprint", "3 challenges, 15 mins each", "Mock practice"],
    ["August wrap-up", "Count your wins — you've come so far 🎉", "Mock practice"],
  ]},
];

const TAG_COLORS = {
  "Portfolio":      { bg: "rgba(167,139,250,0.12)", color: "#a78bfa" },
  "Interview Q&A":  { bg: "rgba(110,231,183,0.12)", color: "#6ee7b7" },
  "Design skills":  { bg: "rgba(249,168,124,0.12)", color: "#f9a87c" },
  "Job hunting":    { bg: "rgba(96,165,250,0.12)",  color: "#60a5fa" },
  "Mock practice":  { bg: "rgba(244,114,182,0.12)", color: "#f472b6" },
  "Rest":           { bg: "rgba(75,85,99,0.2)",     color: "#9ca3af" },
};

const STORAGE_KEY = "vid_ux_prep_done";
let done = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
let currentFilter = "all";

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
}

function toggle(id) {
  if (done.has(id)) done.delete(id); else done.add(id);
  save();
  updateProgress();
  render();
}

function updateProgress() {
  const total = MONTHS.reduce((a, m) => a + m.days.length, 0);
  const count = done.size;
  const pct = Math.round((count / total) * 100);
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("pct-display").innerHTML = pct + '<span>%</span>';
  document.getElementById("days-done-display").textContent = count + " of " + total + " days done";
  document.getElementById("remaining-display").textContent = (total - count) + " days remaining";

  // streak (consecutive from day 1)
  let streak = 0;
  let gd = 0;
  outer: for (const m of MONTHS) {
    for (let i = 0; i < m.days.length; i++) {
      gd++;
      if (done.has(gd)) streak++;
      else break outer;
    }
  }
  document.getElementById("streak-display").textContent = "streak: " + streak + " day" + (streak !== 1 ? "s" : "");
}

function render() {
  const container = document.getElementById("main-content");
  container.innerHTML = "";
  let globalDay = 0;

  MONTHS.forEach(month => {
    const monthDays = [];
    const monthTotal = month.days.length;
    let monthDone = 0;

    month.days.forEach((day, di) => {
      globalDay++;
      const gd = globalDay;
      const isDone = done.has(gd);
      const isRest = day[2] === "Rest";
      if (isDone) monthDone++;

      if (currentFilter === month.name ||
          currentFilter === "all" ||
          (currentFilter === "undone" && !isDone)) {
        monthDays.push({ day, gd, isDone, isRest });
      }
    });

    if (monthDays.length === 0) return;

    const block = document.createElement("div");
    block.className = "month-block";

    block.innerHTML = `
      <div class="month-header">
        <span class="month-name">${month.name}</span>
        <span class="month-theme">${month.theme}</span>
        <span class="month-progress">${monthDone}/${monthTotal}</span>
      </div>
      <div class="days-grid" id="grid-${month.name}"></div>
    `;

    container.appendChild(block);
    const grid = document.getElementById("grid-" + month.name);

    monthDays.forEach(({ day, gd, isDone, isRest }) => {
      const tc = TAG_COLORS[day[2]] || TAG_COLORS["Rest"];
      const card = document.createElement("div");
      card.className = "day-card" + (isDone ? " done" : "") + (isRest ? " rest-day" : "");
      card.innerHTML = `
        <div class="checkbox">${isDone ? "✓" : ""}</div>
        <div class="day-content">
          <div class="day-num">DAY ${gd} · ${day[2].toUpperCase()}</div>
          <div class="day-topic">${day[0]}</div>
          <div class="day-sub">${day[1]}</div>
          <span class="day-tag" style="background:${tc.bg};color:${tc.color}">${day[2]}</span>
        </div>
      `;
      card.onclick = () => toggle(gd);
      grid.appendChild(card);
    });
  });
}

function filterMonth(month, btn) {
  currentFilter = month;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

render();
updateProgress();
</script>
</body>
</html>
